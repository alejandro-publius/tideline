[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tideline-backend"
version = "0.1.0"
description = "FastAPI backend for Tideline: cached NOAA tides & water data"
requires-python = ">=3.11"
# Pinned to the versions the suite is green against, so `pip install` is
# reproducible for a reviewer and in CI. Bump deliberately.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "sqlalchemy==2.0.52",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "mcp==2.1.1",  # Model Context Protocol server (app/mcp_server.py)
    "pika==1.4.4",  # RabbitMQ client for the telemetry event path (ADR 0007)
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.16.3",
    "mypy==2.3.1",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    # Naive datetimes are the documented architecture, not an oversight: every
    # datetime inside the system is naive UTC, and awareness exists only at the
    # serialization boundary where an explicit Z is appended. Enforcing aware
    # datetimes internally would invert that. See docs/adr/0003.
    "DTZ001",
    "DTZ007",
    # FastAPI's dependency injection is expressed as `= Depends(...)` in the
    # signature, which is precisely the mutable-default shape B008 exists to
    # catch. It is the framework's documented idiom and evaluated per request.
    "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# Entry points and the __main__ CLI guard aren't exercised by the suite.
omit = ["app/__init__.py"]
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
python_version = "3.11"
files = ["app"]
warn_redundant_casts = true
warn_unused_ignores = true

# pika ships no type information, so its imports would otherwise fail the run.
# Scoped to pika alone rather than relaxing the whole project.
[[tool.mypy.overrides]]
module = ["pika.*"]
ignore_missing_imports = true
